spring.application.name=plms
server.port=${PORT:8080}

# Database Configuration (DYNAMIC)
# If no Environment Variables are set, it defaults to H2 (In-Memory) for the Cloud.
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:h2:mem:plms_db;DB_CLOSE_DELAY=-1}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:sa}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}

# NO HARDCODED DRIVER - Spring Boot will detect it based on the URL above!
# spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=${SPRING_JPA_DIALECT:org.hibernate.dialect.H2Dialect}

# File Upload
file.upload-dir=uploads

# JWT
# Fixed: Using a simple long string secret to prevent Base64 format errors.
jwt.secret=${JWT_SECRET:NXU1YjlreG9ueXRpYmdhMnU1YjlreG9ueXRpYmdhMnU1YjlreG9ueXRpYmdhMg_plms_cloud_secret_long_enough_for_hs256}
jwt.expiration=86400000
